<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="You are warmly invited to the wedding celebrations of Neelam Singh and Dharamraj Singh, 11-26 February 2027. | आप सादर आमंत्रित हैं।">
<meta name="theme-color" content="#2a0712">
<!-- Link preview (WhatsApp etc.): after deploying, replace the og:image value with the full address, e.g. https://YOUR-SITE.vercel.app/images/og.jpg -->

<meta property="og:image" content="images/og.jpg">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;500;600&family=Poppins:wght@300;400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<script>
/* Intro timing is handled here so the page can never stay locked, even if something else fails */
(function(d){var h=d.documentElement;h.className+=' js loading';
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
setTimeout(function(){h.classList.add('ready')},rm?0:1500);
setTimeout(function(){h.classList.remove('loading')},rm?0:2400);})(document);
</script>
<style>
:root{
  --m9:#2a0712; --m8:#3b0a18; --m7:#5a0f24; --rose:#e8a0b0; --gold:#d9b25f; --gold-soft:#f0dca4; --ivory:#fff6e6;
  --serif:'Cormorant Garamond','Tiro Devanagari Hindi',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.loading,html.loading body{overflow:hidden}
body{font-family:'Poppins','Noto Sans Devanagari',system-ui,sans-serif;line-height:1.75;color:var(--ivory);
  background:radial-gradient(1100px 700px at 85% -5%,rgba(232,160,176,.16),transparent 60%),
             radial-gradient(900px 700px at -10% 45%,rgba(217,178,95,.10),transparent 60%),
             linear-gradient(180deg,#3b0a18 0%,#2a0712 55%,#240510 100%);
  overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}

/* ---------- opening curtain ---------- */
.curtain{position:fixed;inset:0;z-index:200;perspective:1400px;animation:curtainGone .1s linear 3.1s forwards}
.door{position:absolute;top:0;bottom:0;width:50.4%;
  background:repeating-linear-gradient(90deg,rgba(217,178,95,.14) 0 2px,transparent 2px 26px),linear-gradient(180deg,#5a0f24,#2a0712)}
.door::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:linear-gradient(180deg,#f0dca4,#b8862e)}
.door.l{left:0;transform-origin:left center;animation:openL 1.5s cubic-bezier(.7,0,.2,1) 1.2s forwards}
.door.l::after{right:0}
.door.r{right:0;transform-origin:right center;animation:openR 1.5s cubic-bezier(.7,0,.2,1) 1.2s forwards}
.door.r::after{left:0}
.seal{position:absolute;inset:0;display:grid;place-content:center;text-align:center;animation:sealOut .7s ease 1.05s forwards}
.seal .om{font-size:4.4rem;line-height:1;color:var(--gold);text-shadow:0 0 40px rgba(217,178,95,.7);animation:pulse 1.6s ease-in-out infinite}
.seal .shri{margin-top:10px;letter-spacing:.12em;color:var(--gold-soft);font-family:var(--serif);font-size:1.35rem}
@keyframes openL{to{transform:rotateY(100deg)}}
@keyframes openR{to{transform:rotateY(-100deg)}}
@keyframes sealOut{to{opacity:0;transform:scale(1.5)}}
@keyframes curtainGone{to{opacity:0;visibility:hidden}}
@keyframes pulse{50%{transform:scale(1.1)}}

/* ---------- fixed chrome ---------- */
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--rose),var(--gold))}
.nav{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;transition:background .3s}
.nav.solid{background:rgba(42,7,18,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{font-family:var(--serif);font-size:1.25rem;color:var(--gold-soft);letter-spacing:.04em}
.lang{display:flex;border:1px solid var(--gold);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--gold-soft);padding:6px 14px;font:500 .8rem 'Poppins','Noto Sans Devanagari',sans-serif;cursor:pointer}
.lang button.active{background:var(--gold);color:var(--m8)}
.bg-mandala{position:fixed;left:50%;top:50%;width:min(150vmin,1300px);height:min(150vmin,1300px);margin:0;transform:translate(-50%,-50%);color:var(--gold);opacity:.10;pointer-events:none;z-index:0;will-change:transform}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;transform:translateY(130px);opacity:0;transition:transform .45s cubic-bezier(.2,.7,.2,1),opacity .45s}
.fab.show{transform:none;opacity:1}

/* ---------- shared ---------- */
section{position:relative;z-index:2;padding:96px 20px}
.wrap{max-width:1000px;margin:0 auto}
.narrow{max-width:760px}
.sec-title{font-family:var(--serif);font-weight:600;font-size:clamp(2.2rem,6vw,3.5rem);line-height:1.25;text-align:center;color:var(--gold-soft)}
.sec-title::after{content:"✦  ✦  ✦";display:block;font-size:.7rem;letter-spacing:.5em;color:var(--gold);margin-top:8px}
.sec-sub{text-align:center;color:rgba(255,246,230,.75);margin:14px auto 40px;max-width:560px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;font:600 .95rem 'Poppins','Noto Sans Devanagari',sans-serif;color:var(--m8);
  background:linear-gradient(135deg,#f0dca4,#d9b25f 55%,#b8862e);box-shadow:0 10px 30px rgba(217,178,95,.28);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(217,178,95,.4)}
.btn.ghost{background:transparent;color:var(--gold-soft);border:1px solid var(--gold);box-shadow:none}
.center{text-align:center}

/* 3D reveal-on-scroll (only when JS is running) */
.js .r3{opacity:0;transform:perspective(900px) var(--t0,translate3d(0,50px,-120px) rotateX(-22deg));
  transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .r3.in{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:86px 20px 70px;overflow:hidden;z-index:2}
.orb{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.o1{width:300px;height:300px;left:-90px;top:12%;background:rgba(232,160,176,.28)}
.o2{width:380px;height:380px;right:-120px;bottom:6%;background:rgba(217,178,95,.20)}
.hero-grid{position:relative;z-index:2;width:100%;max-width:1100px;margin:0 auto;display:grid;gap:34px;justify-items:center;text-align:center}
.hero-visual{order:-1;position:relative;width:min(64vw,290px);aspect-ratio:2/3}
.hero-text{perspective:900px}
.shri{font-family:var(--serif);font-size:1.25rem;letter-spacing:.12em;color:var(--gold)}
.kicker{letter-spacing:.32em;text-transform:uppercase;font-size:.72rem;color:var(--gold-soft);margin-top:4px}
.names{font-family:'Great Vibes','Tiro Devanagari Hindi',cursive;font-weight:400;line-height:1.1;font-size:clamp(3.4rem,14vw,6.8rem);margin:10px 0 6px}
.names .nm{display:block;background:linear-gradient(180deg,#fff2c9,#d9b25f 62%,#b8862e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(217,178,95,.3));padding:0 .1em}
.names .amp{display:block;font-size:.48em;color:var(--rose);line-height:1}
.dates{font-family:var(--serif);font-size:1.4rem;color:var(--gold-soft);margin-bottom:22px}
.countdown{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.cd{min-width:68px;padding:11px 8px;border:1px solid rgba(217,178,95,.45);border-radius:14px;background:rgba(255,255,255,.05);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-align:center;perspective:400px}
.cd b{display:block;font:600 2rem/1.1 'Cormorant Garamond',serif;color:var(--gold-soft)}
.cd b.flip{animation:flip .5s ease}
.cd span{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
@keyframes flip{from{transform:rotateX(-90deg);opacity:0}to{transform:none;opacity:1}}

.js .rv{opacity:0;transform:translate3d(0,40px,-60px) rotateX(-35deg)}
.js.ready .rv{opacity:1;transform:none;transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*.12s)}

.tilt{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.float{position:absolute;inset:0;transform-style:preserve-3d;animation:floaty 8s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotateY(-3deg)}50%{transform:translateY(-10px) rotateY(3deg)}}
.arch{position:absolute;inset:0;border-radius:999px 999px 26px 26px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 60px rgba(217,178,95,.25);background:#3b0a18}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;transform:scale(1.14);will-change:transform}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.2) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 6s ease-in-out 2.6s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}40%,100%{transform:translateX(120%)}}
.garland{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;transform:translateZ(30px)}
.ring{position:absolute;width:132%;aspect-ratio:1;left:-16%;top:-6%;border-radius:50%;border:2px dashed rgba(217,178,95,.4);animation:spin 45s linear infinite;pointer-events:none}
.glow{position:absolute;inset:-12%;background:radial-gradient(closest-side,rgba(232,160,176,.38),transparent 72%);filter:blur(24px);z-index:-1;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scroll-cue{position:absolute;left:50%;bottom:16px;z-index:3;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-soft);opacity:.8}
.scroll-cue i{width:22px;height:36px;border:2px solid var(--gold);border-radius:12px;position:relative}
.scroll-cue i::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}

@media(min-width:900px){
  .hero-grid{grid-template-columns:1.05fr .95fr;text-align:left;justify-items:stretch;align-items:center;gap:50px}
  .hero-visual{order:2;justify-self:center;width:min(32vw,410px)}
  .hero-text{order:1}
  .countdown{justify-content:flex-start}
}

/* ---------- invitation ---------- */
.diyas{display:flex;justify-content:center;gap:70px;margin-bottom:14px}
.diya{width:64px;height:auto;filter:drop-shadow(0 0 16px rgba(255,190,80,.6))}
.flame{transform-origin:50% 100%;animation:flicker 1.3s ease-in-out infinite alternate}
.diyas .diya:last-child .flame{animation-delay:-.6s}
@keyframes flicker{0%{transform:scale(1,1) rotate(-2deg)}100%{transform:scale(.9,1.12) rotate(2deg)}}
.lit{font-family:var(--serif);font-size:clamp(1.55rem,4.8vw,2.4rem);line-height:1.6;text-align:center;margin:34px 0 26px}
.lit span{color:rgba(255,246,230,.2);transition:color .5s,text-shadow .5s}
.lit span.on{color:var(--ivory);text-shadow:0 0 18px rgba(217,178,95,.35)}
.sign{text-align:center;font-family:var(--serif);font-size:1.4rem;color:var(--gold)}

/* ---------- timeline ---------- */
.tl{position:relative;margin:0 auto;padding-top:6px;--p:0}
.tl::before,.tl::after{content:"";position:absolute;top:0;bottom:0;left:27px;width:3px;border-radius:3px}
.tl::before{background:rgba(217,178,95,.2)}
.tl::after{background:linear-gradient(var(--gold-soft),var(--gold));transform-origin:top;transform:scaleY(var(--p));box-shadow:0 0 14px rgba(217,178,95,.8)}
.tl-item{position:relative;display:grid;grid-template-columns:56px 1fr;grid-template-areas:"node date" "node card";padding-bottom:40px}
.tl-node{grid-area:node;grid-row:1/3;display:flex;justify-content:center;align-items:flex-start}
.tl-node i{width:22px;height:22px;border-radius:50%;margin-top:14px;background:var(--m8);border:3px solid rgba(217,178,95,.4);z-index:2;transition:all .5s}
.tl-item.on .tl-node i{background:var(--gold);border-color:var(--gold-soft);box-shadow:0 0 0 7px rgba(217,178,95,.18),0 0 24px rgba(217,178,95,.9)}
.tl-date{grid-area:date;padding:0 0 10px}
.tl-date b{display:block;font:600 clamp(3.2rem,11vw,4.8rem)/1 'Cormorant Garamond',serif;color:var(--gold)}
.tl-date span{display:block;font-family:var(--serif);font-size:1.35rem;color:var(--gold-soft)}
.tl-date small{display:block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.tl-card{grid-area:card}
.tl-card,.tl-date{--t0:translate3d(40px,24px,-80px) rotateY(-16deg)}
.tl-in{position:relative;padding:24px;border-radius:22px;background:rgba(255,246,230,.06);border:1px solid rgba(217,178,95,.38);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.28);transition:transform .25s ease-out;transform-style:preserve-3d}
.tl-in .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(135deg,rgba(240,220,164,.25),rgba(217,178,95,.08));border:1px solid rgba(217,178,95,.5);margin-bottom:10px}
.tl-in h3{font-family:var(--serif);font-size:2rem;color:var(--gold-soft);line-height:1.2}
.tl-in .desc{color:rgba(255,246,230,.82);margin:6px 0 12px}
.tl-in .meta{list-style:none;font-size:.92rem;color:rgba(255,246,230,.9)}
.tl-in .meta li{padding:2px 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{display:inline-block;padding:7px 14px;border:1px solid var(--gold);border-radius:999px;font-size:.8rem;text-decoration:none;color:var(--gold-soft);transition:background .25s,color .25s}
.chip:hover{background:var(--gold);color:var(--m8)}
@media(min-width:900px){
  .tl::before,.tl::after{left:50%;margin-left:-1.5px}
  .tl-item{grid-template-columns:1fr 84px 1fr;grid-template-areas:"card node date";padding-bottom:56px}
  .tl-item:nth-child(even){grid-template-areas:"date node card"}
  .tl-node{grid-row:auto}
  .tl-date{align-self:center;padding:0 10px}
  .tl-item:nth-child(even) .tl-date{text-align:right}
  .tl-item:nth-child(odd) .tl-card,.tl-item:nth-child(even) .tl-date{--t0:translate3d(-90px,20px,-120px) rotateY(32deg)}
  .tl-item:nth-child(even) .tl-card,.tl-item:nth-child(odd) .tl-date{--t0:translate3d(90px,20px,-120px) rotateY(-32deg)}
}

/* ---------- venue ---------- */
.pin{position:relative;width:60px;height:80px;margin:0 auto 10px}
.pin-dot{position:absolute;left:13px;top:6px;width:34px;height:34px;border-radius:50% 50% 50% 0;background:linear-gradient(135deg,#f0dca4,#d9b25f);transform:rotate(-45deg);animation:bob 1.8s ease-in-out infinite;box-shadow:0 0 22px rgba(217,178,95,.6)}
.pin-dot::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--m8)}
.pulse{position:absolute;left:12px;bottom:12px;width:36px;height:12px;border-radius:50%;border:2px solid var(--gold);animation:ripple 1.8s ease-out infinite}
@keyframes bob{50%{transform:rotate(-45deg) translate(-8px,8px)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.venue-card{padding:30px 24px;text-align:center;border-radius:26px;background:rgba(255,246,230,.06);border:1px solid rgba(217,178,95,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 18px 40px rgba(0,0,0,.28)}
.venue-card h3{font-family:var(--serif);font-size:2rem;color:var(--gold-soft)}
.venue-card .addr{font-size:1.1rem;margin:6px 0 2px}
.venue-card .code{font-size:.85rem;letter-spacing:.14em;opacity:.7}
.venue-card .note{margin:16px auto 0;max-width:520px;font-size:.92rem;color:rgba(255,246,230,.8)}
.vbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}

/* ---------- rsvp ---------- */
.formcard{padding:10px;border-radius:26px;background:#fffaf1;border:2px solid var(--gold);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.formcard iframe{display:block;width:100%;height:1150px;border:0;border-radius:18px;background:#fffaf1}
.open-form{margin-top:22px}

footer{position:relative;z-index:2;text-align:center;padding:64px 20px 96px;border-top:1px solid rgba(217,178,95,.25)}
footer .fn{font-family:'Great Vibes','Tiro Devanagari Hindi',cursive;font-size:clamp(2.6rem,9vw,4rem);color:var(--gold-soft)}
footer p{opacity:.85}
footer .fam{margin-top:10px;font-family:var(--serif);font-size:1.3rem;color:var(--gold)}

@media (prefers-reduced-motion:reduce){
  .js .r3,.js .rv{opacity:1!important;transform:none!important;transition:none!important}
  .curtain,#petals{display:none}
  .float,.ring,.flame,.pin-dot,.pulse,.arch::after,.scroll-cue i::after,.seal .om{animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="curtain" id="curtain" aria-hidden="true">
  <div class="door l"></div><div class="door r"></div>
  <div class="seal"><div class="om">ॐ</div><div class="shri">श्री गणेशाय नमः</div></div>
</div>

<div class="progress" id="progress"></div>
<nav class="nav" id="nav">
  <div class="brand" id="brand">नीलम ♥ धर्मराज</div>
  <div class="lang" role="group" aria-label="Language">
    <button id="bhi" class="active" type="button">हिं</button>
    <button id="ben" type="button">EN</button>
  </div>
</nav>

<svg class="bg-mandala" id="mandala" viewBox="-300 -300 600 600" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"></svg>
<canvas id="petals" aria-hidden="true"></canvas>

<main>
  <!-- HERO -->
  <section class="hero" id="top">
    <div class="orb o1" data-speed=".14"></div>
    <div class="orb o2" data-speed=".22"></div>
    <div class="hero-grid">
      <div class="hero-visual rv" style="--i:2">
        <div class="ring"></div>
        <div class="glow"></div>
        <div class="tilt" id="tilt">
          <div class="float">
            <div class="arch">
              <picture>
                <source srcset="images/couple.webp" type="image/webp">
                <img id="couple" src="images/couple.jpg" alt="Neelam and Dharamraj" width="900" height="1348" fetchpriority="high">
              </picture>
            </div>
            <svg class="garland" id="garland" viewBox="0 0 400 600" aria-hidden="true"></svg>
          </div>
        </div>
      </div>
      <div class="hero-text">
        <p class="shri rv" style="--i:0" data-t="shri"></p>
        <p class="kicker rv" style="--i:1" data-t="kicker"></p>
        <h1 class="names">
          <span class="nm rv" style="--i:2" id="nBride"></span>
          <span class="amp rv" style="--i:3">&amp;</span>
          <span class="nm rv" style="--i:4" id="nGroom"></span>
        </h1>
        <p class="dates rv" style="--i:5" data-t="heroDates"></p>
        <div class="countdown rv" style="--i:6" id="countdown" aria-label="Countdown to the wedding"></div>
        <a class="btn rv" style="--i:7" href="#events" data-t="cta"></a>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"><i></i><span data-t="scroll"></span></div>
  </section>

  <!-- INVITATION -->
  <section id="invite">
    <div class="wrap narrow">
      <div class="diyas r3" aria-hidden="true">
        <svg class="diya" viewBox="0 0 80 70"><path class="flame" d="M40 2 C50 15 52 25 40 34 C28 25 30 15 40 2Z" fill="#ffd36b"/><path d="M6 40 Q40 78 74 40 Z" fill="#c9852b"/><ellipse cx="40" cy="40" rx="34" ry="6" fill="#e6a843"/></svg>
        <svg class="diya" viewBox="0 0 80 70"><path class="flame" d="M40 2 C50 15 52 25 40 34 C28 25 30 15 40 2Z" fill="#ffd36b"/><path d="M6 40 Q40 78 74 40 Z" fill="#c9852b"/><ellipse cx="40" cy="40" rx="34" ry="6" fill="#e6a843"/></svg>
      </div>

/* ------------------------------------------------------------------

------------------------------------------------------------------ */
var lang='hi';
try{var s=localStorage.getItem('lang'); if(s==='hi'||s==='en') lang=s;}catch(e){}

function pad(n){return String(n).padStart(2,'0')}
function calLink(e){
  var s=e.date[0]+pad(e.date[1])+pad(e.date[2]);
  var nx=new Date(Date.UTC(e.date[0],e.date[1]-1,e.date[2]+1));
  var en=nx.getUTCFullYear()+pad(nx.getUTCMonth()+1)+pad(nx.getUTCDate());
  var q=new URLSearchParams({action:'TEMPLATE',text:e.t.en+' | Neelam & Dharamraj Wedding',dates:s+'/'+en,
    details:'You are warmly invited to the wedding celebrations of Neelam Singh and Dharamraj Singh.'});
  if(e.home) q.set('location','Raghunathpur, Gilaula, Shravasti, Uttar Pradesh');
  return 'https://calendar.google.com/calendar/render?'+q.toString();
}

var items=[], words=[], litN=-1, io;

function buildTimeline(instant){
  var t=T[lang];
  $('#tl').innerHTML=EVENTS.map(function(e,i){
    var d=new Date(Date.UTC(e.date[0],e.date[1]-1,e.date[2]));
    var venue=e.home?t.homeVenue:t.tbaVenue;
    var map=e.home?'<a class="chip" href="'+MAP+'" target="_blank" rel="noopener">📍 '+t.openMap+'</a>':'';
    return '<article class="tl-item">'+
      '<div class="tl-node"><i></i></div>'+
      '<div class="tl-date r3" style="--d:.05s"><b>'+e.date[2]+'</b><span>'+t.mo[e.date[1]-1]+' '+e.date[0]+'</span><small>'+t.wd[d.getUTCDay()]+'</small></div>'+
      '<div class="tl-card r3" style="--d:.15s"><div class="tl-in">'+
        '<div class="ico">'+e.icon+'</div><h3>'+e.t[lang]+'</h3><p class="desc">'+e.d[lang]+'</p>'+
        '<ul class="meta"><li>🕘 '+t.wholeDay+'</li><li>📍 '+venue+'</li></ul>'+
        '<div class="chips">'+map+'<a class="chip" href="'+calLink(e)+'" target="_blank" rel="noopener">🗓 '+t.addCal+'</a></div>'+
      '</div></div></article>';
  }).join('');
  items=$$('.tl-item');

}

function buildLit(){

  words=$$('#lit span'); litN=-1;
  if(reduce||!html.classList.contains('js')) words.forEach(function(w){w.classList.add('on')});
}

function render(instant){

  $('#brand').textContent=t.brand;
  $('#nBride').textContent=NAMES.bride[lang];
  $('#nGroom').textContent=NAMES.groom[lang];
  $('#fNames').textContent=NAMES.bride[lang]+' & '+NAMES.groom[lang];
  $('#couple').alt=NAMES.bride.en+' and '+NAMES.groom.en;
  $('#bhi').classList.toggle('active',lang==='hi');
  $('#ben').classList.toggle('active',lang==='en');
  ['d','h','m','s'].forEach(function(k){var l=$('.cd [data-l="'+k+'"]'); if(l) l.textContent=t[{d:'days',h:'hours',m:'mins',s:'secs'}[k]];});
  $('#mapBtn').href=MAP; $('#dirBtn').href=DIR;
  $('#formLink').href=FORM_URL.replace('?embedded=true','');
  buildLit(); buildTimeline(instant);
  tick(); schedule();
}

function setLang(l){

/* ------------------------------------------------------------------
   Countdown
------------------------------------------------------------------ */
var cdBox=$('#countdown');
cdBox.innerHTML=['d','h','m','s'].map(function(k){return '<div class="cd"><b data-k="'+k+'">0</b><span data-l="'+k+'"></span></div>'}).join('');
var cdPrev={};
function tick(){
  var diff=WEDDING-new Date();
  if(diff<=0){cdBox.innerHTML='<div class="cd" style="min-width:0;padding:12px 18px"><b>🎉</b><span style="letter-spacing:.04em;text-transform:none;font-size:.9rem">'+T[lang].started+'</span></div>'; return;}
  var v={d:Math.floor(diff/864e5),h:Math.floor(diff%864e5/36e5),m:Math.floor(diff%36e5/6e4),s:Math.floor(diff%6e4/1e3)};
  for(var k in v){
    var b=$('.cd [data-k="'+k+'"]'); if(!b) continue;
    if(cdPrev[k]!==v[k]){
      b.textContent=v[k];
      if(cdPrev[k]!==undefined&&!reduce){b.classList.remove('flip'); void b.offsetWidth; b.classList.add('flip');}
      cdPrev[k]=v[k];
    }
  }
}
setInterval(tick,1000);

/* ------------------------------------------------------------------
   Decorations: mandala, garland
------------------------------------------------------------------ */
(function(){
  var g=$('#mandala');
  function add(tag,attrs){var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); g.appendChild(e); return e;}
  [290,262,178,96,40].forEach(function(r,i){add('circle',{r:r,'stroke-dasharray':i===1?'2 9':'none'})});
  var i;
  for(i=0;i<24;i++) add('ellipse',{cx:0,cy:-215,rx:26,ry:72,transform:'rotate('+(i*15)+')'});
  for(i=0;i<12;i++) add('ellipse',{cx:0,cy:-132,rx:22,ry:52,transform:'rotate('+(i*30+15)+')'});
  for(i=0;i<36;i++) add('circle',{cx:0,cy:-276,r:2.6,fill:'currentColor',transform:'rotate('+(i*10)+')'});
})();
(function(){
  var svg=$('#garland');
  var path=document.createElementNS(NS,'path');
  path.setAttribute('d','M3,455 L3,200 A197,197 0 0 1 397,200 L397,455');
  svg.appendChild(path);
  var L=path.getTotalLength(), n=Math.round(L/19), cols=['#ffb703','#fb8500','#ffd166','#f77f00'];
  for(var i=0;i<=n;i++){
    var p=path.getPointAtLength(L*i/n);
    var c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r',9+(i%2)); c.setAttribute('fill',cols[i%4]); svg.appendChild(c);
    var d=document.createElementNS(NS,'circle'); d.setAttribute('cx',p.x); d.setAttribute('cy',p.y); d.setAttribute('r',3); d.setAttribute('fill','#a34a00'); d.setAttribute('opacity','.5'); svg.appendChild(d);
  }

/* ------------------------------------------------------------------
   Falling petals
------------------------------------------------------------------ */
(function(){
  if(reduce) return;
  var c=$('#petals'), g=c.getContext('2d'), W=0,H=0,dpr=1, P=[], N=innerWidth<700?16:30;
  var cols=['255,183,3','244,143,177','255,243,224','231,194,106','251,133,0'];
  function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;}
  function mk(top){return {x:Math.random()*W,y:top?-20*dpr:Math.random()*H,s:(4+Math.random()*5)*dpr,vy:(.35+Math.random()*.7)*dpr,vx:(Math.random()-.5)*.4*dpr,
    r:Math.random()*6.28,vr:(Math.random()-.5)*.03,ph:Math.random()*6.28,sw:.5+Math.random()*1.2,c:cols[(Math.random()*cols.length)|0]};}
  size(); for(var i=0;i<N;i++) P.push(mk(false));
  addEventListener('resize',size);
  function loop(){
    if(!document.hidden){
      g.clearRect(0,0,W,H);
      for(var i=0;i<N;i++){
        var p=P[i]; p.y+=p.vy; p.ph+=.02; p.x+=p.vx+Math.sin(p.ph)*p.sw*.5*dpr; p.r+=p.vr;
        if(p.y>H+20||p.x<-30||p.x>W+30){P[i]=mk(true);continue;}
        g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.scale(1,.55+.45*Math.sin(p.ph*1.6));
        g.fillStyle='rgba('+p.c+',.78)'; g.beginPath(); g.ellipse(0,0,p.s,p.s*.55,0,0,6.2832); g.fill(); g.restore();
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ------------------------------------------------------------------

------------------------------------------------------------------ */
if('IntersectionObserver' in window){
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in'); io.unobserve(e.target);}})},{threshold:.14,rootMargin:'0px 0px -6% 0px'});
  $$('.r3').forEach(function(el){io.observe(el)});
}else{
  $$('.r3').forEach(function(el){el.classList.add('in')});

/* ------------------------------------------------------------------
   Scroll + pointer driven 3D motion
------------------------------------------------------------------ */
var hero=$('#top'), tiltEl=$('#tilt'), img=$('#couple'), mand=$('#mandala'), nav=$('#nav'), bar=$('#progress'), fab=$('#fab'), tl=$('#tl'), rsvp=$('#rsvp'), litEl=$('#lit');
var orbs=$$('[data-speed]');
var tx=0,ty=0,cx=0,cy=0, raf=0;

function schedule(){ if(!raf) raf=requestAnimationFrame(frame); }

function frame(){
  raf=0;
  var y=window.pageYOffset, vh=window.innerHeight, doc=html.scrollHeight-vh;
  bar.style.transform='scaleX('+(doc>0?y/doc:0)+')';
  nav.classList.toggle('solid',y>40);

  if(!reduce){
    mand.style.transform='translate(-50%,-50%) rotate('+(y*.03)+'deg) scale('+(1+clamp(y/8000,0,.35))+')';
    var hh=hero.offsetHeight, sp=clamp(y/hh,0,1);
    cx+=(tx-cx)*.09; cy+=(ty-cy)*.09;
    tiltEl.style.transform='perspective(1100px) rotateY('+(cx*9)+'deg) rotateX('+(-cy*7+sp*16)+'deg) translateY('+(-sp*50)+'px) scale('+(1-sp*.1)+')';
    img.style.transform='translate3d('+(-cx*8)+'px,'+(sp*44-cy*6)+'px,0) scale(1.14)';
    if(y<hh*1.3) orbs.forEach(function(o){o.style.transform='translate3d(0,'+(y*parseFloat(o.getAttribute('data-speed')))+'px,0)'});
    if(Math.abs(tx-cx)>.002||Math.abs(ty-cy)>.002) schedule();
  }

  /* words light up as the invitation text scrolls through */
  if(words.length&&!reduce){
    var r=litEl.getBoundingClientRect();
    var n=Math.round(clamp((vh*.88-r.top)/(vh*.5),0,1)*words.length);
    if(n!==litN){words.forEach(function(w,i){w.classList.toggle('on',i<n)}); litN=n;}
  }

  /* timeline line draws itself, dots light up */
  var tr=tl.getBoundingClientRect();
  tl.style.setProperty('--p',clamp((vh*.62-tr.top)/tr.height,0,1).toFixed(4));
  items.forEach(function(it){it.classList.toggle('on',it.getBoundingClientRect().top<vh*.62)});

  /* floating RSVP button */
  var rr=rsvp.getBoundingClientRect();
  fab.classList.toggle('show',y>hero.offsetHeight*.6&&rr.top>vh*.75);
}
addEventListener('scroll',schedule,{passive:true});
addEventListener('resize',schedule);

if(window.matchMedia&&matchMedia('(pointer:fine)').matches){
  hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect(); tx=((e.clientX-r.left)/r.width-.5)*2; ty=((e.clientY-r.top)/r.height-.5)*2; schedule();});
  hero.addEventListener('pointerleave',function(){tx=0;ty=0;schedule();});
  /* tilt the event cards under the cursor */
  tl.addEventListener('pointermove',function(e){
    var c=e.target.closest&&e.target.closest('.tl-in'); if(!c) return;
    var r=c.getBoundingClientRect(), px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
    c.style.transform='perspective(800px) rotateY('+(px*10)+'deg) rotateX('+(-py*10)+'deg) translateZ(8px)';
  });
  tl.addEventListener('pointerout',function(e){var c=e.target.closest&&e.target.closest('.tl-in'); if(c&&!c.contains(e.relatedTarget)) c.style.transform='';});
}

/* tap the curtain to skip it */
$('#curtain').addEventListener('click',function(){html.classList.add('ready');html.classList.remove('loading');this.style.display='none';});

/* the form is only loaded once, at the end of setup */
$('#form').src=FORM_URL;

render(false);
frame();
})();
